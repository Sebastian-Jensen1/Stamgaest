<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stamgæst — Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #e7e9ee;
    --muted: #9aa1ae;
    --accent: #6c8cff;
    --accent-hover: #5779e6;
    --danger: #ff6b6b;
    --success: #4dd08a;
    --new: #f5b301;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .setup {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 20px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .setup .field { flex: 1; min-width: 160px; }
  .setup label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .setup input, .setup select {
    width: 100%;
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 10px;
    font-size: 13px;
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat-card .num { font-size: 26px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat-card.new .num { color: var(--new); }
  .panel { background: var(--card); border: 1px dashed var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .panel .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .panel input, .panel select, .panel textarea {
    background: #10131a; border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    padding: 8px 10px; font-size: 13px; font-family: inherit;
  }
  .panel .name-field { flex: 1; min-width: 220px; }
  .panel button { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .tabs { display: flex; gap: 18px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 8px 2px 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar button.chip {
    background: #10131a; border: 1px solid var(--border); color: var(--text);
    padding: 7px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
  }
  .toolbar button.chip:hover { border-color: var(--accent); }
  .toolbar .spacer { flex: 1; }
  .toolbar button.primary-action {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .toolbar button.primary-action:disabled { opacity: 0.4; cursor: not-allowed; }
  .toolbar button.primary-action:hover:not(:disabled) { background: var(--accent-hover); }
  .toolbar button.secondary-action {
    background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .toolbar button.secondary-action:disabled { opacity: 0.4; cursor: not-allowed; }
  .toolbar button.secondary-action:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .review-row { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .review-row.is-new { border-left: 3px solid var(--new); }
  .review-head { display: flex; align-items: flex-start; gap: 12px; }
  .review-head input[type="checkbox"] { margin-top: 4px; width: 16px; height: 16px; }
  .review-info { flex: 1; min-width: 0; }
  .review-info .top-line { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 4px; flex-wrap: wrap; }
  .review-info .name { font-weight: 600; }
  .stars { color: #f5b301; font-size: 12px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); }
  .badge.new { color: var(--new); border-color: var(--new); }
  .badge.ready { color: var(--accent); border-color: var(--accent); }
  .badge.sent { color: var(--success); border-color: var(--success); }
  .review-text { font-size: 13px; color: var(--muted); font-style: italic; }
  .draft-box { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .draft-box textarea {
    width: 100%; min-height: 80px; background: #10131a; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 10px; font-size: 13px; font-family: inherit; resize: vertical;
  }
  .draft-actions { display: flex; gap: 8px; margin-top: 8px; }
  .draft-actions button { border: none; border-radius: 6px; padding: 7px 12px; font-size: 12px; cursor: pointer; }
  .btn-send { background: var(--success); color: #0a1a12; font-weight: 600; }
  .btn-send:disabled { background: var(--border); color: var(--muted); cursor: default; }
  .btn-regen { background: transparent; border: 1px solid var(--border) !important; color: var(--muted); }
  .send-note { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .error { color: var(--danger); font-size: 13px; margin: 10px 0; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }
  .login-card {
    max-width: 380px; margin: 12vh auto 0; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 24px;
  }
  .login-card h1 { margin-bottom: 4px; }
  .login-card .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .field-block { margin-bottom: 14px; }
  .field-block label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field-block input {
    width: 100%; background: #10131a; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 11px; font-size: 14px; font-family: inherit;
  }
  .btn-primary {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .topbar h1 { margin: 0; }
  .who { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .who strong { color: var(--text); }
  .linkbtn {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 11px; font-size: 12px; cursor: pointer;
  }
  .linkbtn:hover { border-color: var(--accent); color: var(--accent); }
  .setup .refresh { flex: 2; min-width: 240px; }
  .setup .refresh button {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .setup .refresh button:disabled { opacity: 0.5; cursor: not-allowed; }
  #pwPanel form { display: grid; gap: 10px; max-width: 360px; margin-top: 10px; }
  #pwPanel summary { cursor: pointer; font-size: 13px; }
  .ok { color: var(--success); font-size: 13px; margin: 6px 0; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Vises når man ikke er logget ind -->
  <div id="loginView" hidden>
    <form class="login-card" id="loginForm" autocomplete="on">
      <h1>Stamgæst</h1>
      <p class="sub">Log ind for at se og besvare din cafés anmeldelser.</p>
      <div class="field-block">
        <label for="loginEmail">E-mail</label>
        <input id="loginEmail" type="email" name="email" autocomplete="username" required />
      </div>
      <div class="field-block">
        <label for="loginPassword">Adgangskode</label>
        <input id="loginPassword" type="password" name="password" autocomplete="current-password" required />
      </div>
      <div id="loginError" class="error" role="alert"></div>
      <button class="btn-primary" id="loginBtn" type="submit">Log ind</button>
    </form>
  </div>

  <!-- Vises når man er logget ind -->
  <div id="appView" hidden>
    <div class="topbar">
      <h1 id="cafeName">Stamgæst</h1>
      <div class="who">
        <span id="userEmail"></span>
        <button class="linkbtn" id="logoutBtn" type="button">Log ud</button>
      </div>
    </div>

    <details class="panel" id="pwPanel">
      <summary>Skift adgangskode</summary>
      <form id="pwForm" autocomplete="off">
        <div class="field-block" style="margin:0;"><label for="pwCurrent">Nuværende adgangskode</label><input id="pwCurrent" type="password" autocomplete="current-password" required /></div>
        <div class="field-block" style="margin:0;"><label for="pwNew">Ny adgangskode (mindst 10 tegn)</label><input id="pwNew" type="password" autocomplete="new-password" minlength="10" required /></div>
        <div class="field-block" style="margin:0;"><label for="pwRepeat">Gentag ny adgangskode</label><input id="pwRepeat" type="password" autocomplete="new-password" required /></div>
        <div id="pwMessage" class="error" role="alert"></div>
        <button class="btn-primary" type="submit" style="width:auto;">Gem ny adgangskode</button>
      </form>
    </details>

    <div class="setup">
      <div class="field">
        <label for="tone">Tone i svarene</label>
        <select id="tone">
          <option value="venligt og professionelt">Venligt og professionelt</option>
          <option value="afslappet og personligt">Afslappet og personligt</option>
          <option value="formelt">Formelt</option>
        </select>
      </div>
      <div class="field refresh">
        <button id="refreshBtn" type="button">Hent seneste anmeldelser</button>
        <div class="send-note" id="lastFetched"></div>
        <div class="send-note">⚠ Google udstiller maks. 5 anmeldelser pr. sted — ikke alle jeres.</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card new"><div class="num" id="statNew">0</div><div class="label">Nye siden sidst</div></div>
      <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Anmeldelser i alt</div></div>
      <div class="stat-card"><div class="num" id="statSent">0</div><div class="label">Besvarede</div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="unanswered">Nye / ubesvarede</button>
      <button class="tab-btn" data-tab="answered">Besvarede</button>
    </div>

    <div class="toolbar">
      <label id="selectAllWrap" style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer;">
        <input type="checkbox" id="selectAllCheck" />
        Markér alle
      </label>
      <button class="chip" data-filter="all">Alle</button>
      <button class="chip" data-filter="5">★★★★★</button>
      <button class="chip" data-filter="4">★★★★☆</button>
      <button class="chip" data-filter="low">≤3 stjerner</button>
      <div class="spacer"></div>
      <button class="secondary-action" id="bulkMarkAnswered" disabled>Markér som besvaret (0)</button>
      <button class="primary-action" id="bulkGenerate" disabled>Generér svar for valgte (0)</button>
    </div>

    <div id="error" class="error" role="alert"></div>
    <div id="reviewList"></div>
    <div id="emptyState" class="empty" hidden></div>
  </div>

</div>

<script>
  let reviews = [];
  let currentFilter = "all";
  let currentTab = "unanswered";

  const $ = (id) => document.getElementById(id);
  const reviewList = $("reviewList");
  const emptyState = $("emptyState");
  const errorDiv = $("error");

  // Alt der kommer udefra (anmeldernes navne og tekster fra Google, Claudes
  // udkast, stednavne) skal renses før det sættes ind som HTML. Ellers kan en
  // anmeldelse med <img src=x onerror=...> køre kode i ejerens browser — og nu
  // hvor anmeldelser gemmes i databasen, sker det hver gang siden åbnes.
  function esc(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function starString(n) {
    n = Number(n);
    return "★".repeat(n) + "☆".repeat(5 - n);
  }

  // ---- Kald til serveren ------------------------------------------------------

  // Alle kald går gennem denne. Serveren svarer altid med {error} ved fejl. Uden
  // tjekket ville en fejlet gemning se ud som om den lykkedes, fordi fetch kun
  // kaster ved netværksfejl — ikke ved 400 og 500. Svarer serveren 401 ("ikke
  // logget ind" eller "login udløbet"), sendes brugeren til loginsiden.
  async function api(method, url, body) {
    const options = { method, headers: {} };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    const res = await fetch(url, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(data.error || `Serverfejl (${res.status})`);
      err.status = res.status;
      // Et forkert kodeord ved login er også en 401, men der skal vi blive på loginsiden.
      if (res.status === 401 && url !== "/api/auth/login") showLogin();
      throw err;
    }
    return data;
  }

  // ---- Login og log ud --------------------------------------------------------

  // Viser loginsiden og fjerner alt fra skærmen, der tilhører den forrige bruger.
  function showLogin(message) {
    reviews = [];
    reviewList.innerHTML = "";
    errorDiv.textContent = "";
    $("appView").hidden = true;
    $("loginView").hidden = false;
    $("loginError").textContent = message || "";
    $("loginPassword").value = "";
  }

  function showApp(me) {
    $("loginView").hidden = true;
    $("appView").hidden = false;
    $("cafeName").textContent = me.businessName || "Stamgæst";
    $("userEmail").textContent = me.email;
  }

  // Tjekker om man allerede er logget ind (cookien findes), og viser i så fald anmeldelserne.
  async function boot() {
    try {
      const me = await api("GET", "/api/auth/me");
      showApp(me);
      await loadDashboard();
    } catch (err) {
      if (err.status !== 401) showLogin(err.message);
    }
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("loginBtn");
    btn.disabled = true;
    $("loginError").textContent = "";
    try {
      await api("POST", "/api/auth/login", {
        email: $("loginEmail").value.trim(),
        password: $("loginPassword").value,
      });
      $("loginPassword").value = "";
      await boot();
    } catch (err) {
      $("loginError").textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });

  $("logoutBtn").addEventListener("click", async () => {
    try { await api("POST", "/api/auth/logout", {}); } catch (_) { /* vi logger ud på skærmen uanset */ }
    showLogin();
  });

  $("pwForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("pwMessage");
    msg.className = "error";
    msg.textContent = "";
    if ($("pwNew").value !== $("pwRepeat").value) {
      msg.textContent = "De to nye adgangskoder er ikke ens.";
      return;
    }
    try {
      await api("POST", "/api/auth/password", {
        currentPassword: $("pwCurrent").value,
        newPassword: $("pwNew").value,
      });
      $("pwForm").reset();
      msg.className = "ok";
      msg.textContent = "Adgangskoden er skiftet. Andre enheder er logget ud.";
    } catch (err) {
      msg.textContent = err.message;
    }
  });

  // ---- Anmeldelser ------------------------------------------------------------

  // Ét sted der tager et serversvar og gør det til appens tilstand — bruges både når
  // siden åbnes og når man henter nye anmeldelser fra Google.
  function applyDashboard(data) {
    reviews = data.reviews;
    $("cafeName").textContent = data.businessName || "Stamgæst";
    if (data.defaultTone && [...$("tone").options].some(o => o.value === data.defaultTone)) {
      $("tone").value = data.defaultTone;
    }
    $("lastFetched").textContent = data.reviewsFetchedAt
      ? "Sidst hentet: " + new Date(data.reviewsFetchedAt).toLocaleString("da-DK")
      : "Anmeldelser er ikke hentet endnu.";
    render();
  }

  async function loadDashboard() {
    applyDashboard(await api("GET", "/api/reviews"));
  }

  $("refreshBtn").addEventListener("click", async () => {
    errorDiv.textContent = "";
    const btn = $("refreshBtn");
    btn.disabled = true;
    btn.textContent = "Henter...";
    try {
      const before = reviews.length;
      // Serveren ved selv hvilken café det gælder, ud fra dit login.
      applyDashboard(await api("POST", "/api/reviews/refresh", {}));
      if (reviews.length === before) {
        errorDiv.textContent = "Ingen nye anmeldelser at hente (de var allerede gemt).";
      }
    } catch (err) {
      errorDiv.textContent = "Fejl: " + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Hent seneste anmeldelser";
    }
  });

  function updateStats() {
    $("statNew").textContent = reviews.filter(r => r.status === "new").length;
    $("statTotal").textContent = reviews.length;
    $("statSent").textContent = reviews.filter(r => r.status === "sent").length;
  }

  function filteredReviews() {
    const base = currentTab === "answered"
      ? reviews.filter(r => r.status === "sent")
      : reviews.filter(r => r.status !== "sent");
    if (currentFilter === "all") return base;
    if (currentFilter === "low") return base.filter(r => Number(r.rating) <= 3);
    return base.filter(r => String(r.rating) === currentFilter);
  }

  function render() {
    updateStats();
    const list = filteredReviews();
    reviewList.innerHTML = "";
    emptyState.hidden = list.length !== 0;
    emptyState.textContent = currentTab === "answered"
      ? "Ingen besvarede anmeldelser endnu."
      : "Ingen anmeldelser endnu — tryk på \"Hent seneste anmeldelser\" ovenfor.";

    list.forEach(r => {
      const row = document.createElement("div");
      row.className = "review-row" + (r.status === "new" ? " is-new" : "");

      const badge = r.status === "new" ? '<span class="badge new">Ny</span>'
        : r.status === "ready" ? '<span class="badge ready">Udkast klar</span>'
        : r.status === "sent" ? '<span class="badge sent">✓ Besvaret</span>'
        : '';

      let draftSection = "";
      if (r.status === "sent") {
        if (r.draft) {
          draftSection = `
            <div class="draft-box">
              <div class="review-text" style="font-style: normal;">${esc(r.draft)}</div>
            </div>
          `;
        }
      } else if (r.draft) {
        draftSection = `
          <div class="draft-box">
            <textarea class="draftText" data-id="${esc(r.id)}">${esc(r.draft)}</textarea>
            <div class="draft-actions">
              <button class="btn-send" data-id="${esc(r.id)}">Send til Google</button>
              <button class="btn-regen" data-id="${esc(r.id)}">Generér igen</button>
            </div>
            <div class="send-note">⚠ Prototype: "Send" kopierer svaret til udklipsholder for nu — automatisk afsendelse til Google kræver godkendt Business Profile API-adgang (se README).</div>
          </div>
        `;
      }

      row.innerHTML = `
        <div class="review-head">
          ${currentTab === "unanswered" ? `<input type="checkbox" class="rowCheck" data-id="${esc(r.id)}" />` : ""}
          <div class="review-info">
            <div class="top-line">
              <span class="name">${esc(r.reviewerName) || "Anonym"}</span>
              <span class="stars">${starString(r.rating)}</span>
              ${badge}
            </div>
            <div class="review-text">"${esc(r.reviewText)}"</div>
          </div>
        </div>
        ${draftSection}
      `;
      reviewList.appendChild(row);
    });

    updateBulkButtons();
  }

  function updateBulkButtons() {
    const all = document.querySelectorAll(".rowCheck");
    const checked = document.querySelectorAll(".rowCheck:checked").length;
    const generateBtn = $("bulkGenerate");
    const markBtn = $("bulkMarkAnswered");
    generateBtn.textContent = `Generér svar for valgte (${checked})`;
    generateBtn.disabled = checked === 0;
    markBtn.textContent = `Markér som besvaret (${checked})`;
    markBtn.disabled = checked === 0;

    const selectAllCheck = $("selectAllCheck");
    selectAllCheck.checked = all.length > 0 && checked === all.length;
    selectAllCheck.indeterminate = checked > 0 && checked < all.length;
  }

  $("selectAllCheck").addEventListener("change", (e) => {
    document.querySelectorAll(".rowCheck").forEach(cb => cb.checked = e.target.checked);
    updateBulkButtons();
  });

  reviewList.addEventListener("change", (e) => {
    if (e.target.classList.contains("rowCheck")) updateBulkButtons();
    if (e.target.classList.contains("draftText")) {
      // Kun lokalt mens man skriver. Teksten gemmes når man trykker "Send" —
      // ellers ville hvert tastetryk blive et kald til serveren.
      const r = reviews.find(x => x.id === e.target.dataset.id);
      if (r) r.draft = e.target.value;
    }
  });

  reviewList.addEventListener("click", async (e) => {
    const id = e.target.dataset.id;
    if (e.target.classList.contains("btn-send")) {
      const r = reviews.find(x => x.id === id);
      if (!r) return;

      // Teksten læses fra feltet frem for fra r.draft: har man rettet i den og
      // ikke forladt feltet endnu, er change-eventet ovenfor ikke nået at køre,
      // og så ville vi gemme den gamle tekst.
      const field = document.querySelector(`.draftText[data-id="${id}"]`);
      const finalText = field ? field.value : r.draft;

      navigator.clipboard.writeText(finalText);
      try {
        await api("POST", `/api/reviews/${id}/send`, { finalText });
        r.draft = finalText;
        r.status = "sent";
        render();
      } catch (err) {
        errorDiv.textContent = "Kunne ikke gemme svaret: " + err.message;
      }
    }
    if (e.target.classList.contains("btn-regen")) {
      generateFor([id]);
    }
  });

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentTab = btn.dataset.tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      $("bulkGenerate").style.display = currentTab === "answered" ? "none" : "";
      $("bulkMarkAnswered").style.display = currentTab === "answered" ? "none" : "";
      $("selectAllWrap").style.display = currentTab === "answered" ? "none" : "flex";
      render();
    });
  });

  document.querySelectorAll(".toolbar .chip").forEach(chip => {
    chip.addEventListener("click", () => {
      currentFilter = chip.dataset.filter;
      document.querySelectorAll(".toolbar .chip").forEach(c => c.style.borderColor = "");
      chip.style.borderColor = "var(--accent)";
      render();
    });
  });

  $("bulkGenerate").addEventListener("click", () => {
    const ids = Array.from(document.querySelectorAll(".rowCheck:checked")).map(cb => cb.dataset.id);
    generateFor(ids);
  });

  $("bulkMarkAnswered").addEventListener("click", async () => {
    errorDiv.textContent = "";
    const ids = Array.from(document.querySelectorAll(".rowCheck:checked")).map(cb => cb.dataset.id);

    try {
      // Først når serveren har bekræftet hver enkelt, flyttes den i listen.
      // Ellers ville en anmeldelse se besvaret ud indtil man genindlæste siden.
      for (const id of ids) {
        await api("POST", `/api/reviews/${id}/answered`, {});
        const r = reviews.find(x => x.id === id);
        if (r) r.status = "sent";
      }
      render();
    } catch (err) {
      errorDiv.textContent = "Kunne ikke markere som besvaret: " + err.message;
      render();
    }
  });

  async function generateFor(ids) {
    errorDiv.textContent = "";
    const toGenerate = reviews.filter(r => ids.includes(r.id));
    if (toGenerate.length === 0) return;

    const btn = $("bulkGenerate");
    btn.disabled = true;
    btn.textContent = "Genererer...";

    try {
      // Kun id'er og tone sendes. Anmeldelsens tekst og caféens navn læser serveren selv
      // fra databasen, og hvilken café det gælder ved den ud fra dit login.
      const data = await api("POST", "/api/generate", {
        tone: $("tone").value,
        reviews: toGenerate.map(r => ({ id: r.id })),
      });

      data.results.forEach(result => {
        const r = reviews.find(x => x.id === result.id);
        if (r) {
          r.draft = result.draft;
          r.status = "ready";
        }
      });
      render();
    } catch (err) {
      errorDiv.textContent = "Fejl: " + err.message;
    } finally {
      updateBulkButtons();
    }
  }

  boot();
</script>
</body>
</html>
