[project]
name = "python-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.7.0",
    "argon2-cffi>=25.1.0",
    "certifi>=2026.7.22",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
